name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: npm pack --dry-run
      - name: Check npm version
        id: npm_version
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          error_file="$(mktemp)"

          if published_version="$(npm view "$package_spec" version --json 2>"$error_file")"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec already exists on npm ($published_version); skipping publish."
          elif grep -Eq "(E404|404 Not Found|is not in this registry)" "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$package_spec is not published on npm; publish will proceed."
          else
            echo "Unable to verify whether $package_spec exists on npm. Failing closed."
            cat "$error_file"
            exit 1
          fi

          rm -f "$error_file"
      - name: Publish to npm
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --access public
